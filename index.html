<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luka</title>
<meta name="theme-color" content="#141c45">
<meta name="description" content="Registro de gastos fijos y variables">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F7F8FC; --ink:#0F1A33; --ink-2:#56607A; --ink-3:#8C94A8;
  --line:#E4E8F1; --primary:#3056F5; --primary-soft:#E6ECFF; --good:#14A874; --warn:#E08A00; --bad:#E5484D;
  --hero-a:#1B2B5E; --hero-b:#3056F5; --shadow:0 1px 2px rgba(15,26,51,.05),0 8px 24px rgba(15,26,51,.06);
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1022; --surface:#121A31; --surface-2:#18213B; --ink:#EEF1F8; --ink-2:#A9B1C7; --ink-3:#6F7894;
  --line:#243052; --primary:#6F8BFF; --primary-soft:#1F2A52; --good:#35C993; --warn:#F2A93B; --bad:#FF6B6F;
  --hero-a:#16224A; --hero-b:#2B48C9; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0A1022; --surface:#121A31; --surface-2:#18213B; --ink:#EEF1F8; --ink-2:#A9B1C7; --ink-3:#6F7894;
  --line:#243052; --primary:#6F8BFF; --primary-soft:#1F2A52; --good:#35C993; --warn:#F2A93B; --bad:#FF6B6F;
  --hero-a:#16224A; --hero-b:#2B48C9; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--hero-b),#6FD3FF);display:grid;place-items:center;color:#fff;font-size:15px}
.tabs-top{display:none;gap:4px;background:var(--surface);padding:4px;border-radius:999px;box-shadow:var(--shadow)}
.tabs-top button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.tabs-top button[aria-current="true"]{background:var(--primary-soft);color:var(--primary)}
.icon-btn{border:0;background:var(--surface);width:40px;height:40px;border-radius:12px;box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink-2)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav.bottom button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 2px;border-radius:12px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="true"]{color:var(--primary)}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;background:var(--primary);color:#fff;box-shadow:0 5px 12px color-mix(in srgb,var(--primary) 20%,transparent);display:grid;place-items:center;z-index:21}
.fab svg{width:26px;height:26px}
@media (min-width:880px){
  .tabs-top{display:flex} nav.bottom{display:none} .app{padding-bottom:48px}
  .fab{bottom:32px;right:max(24px,calc(50% - 540px + 8px))}
}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
@media (min-width:880px){.grid.home{grid-template-columns:1.45fr 1fr;align-items:start}.span2{grid-column:1/-1}}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px}
.card h2{font-size:16px;margin:0 0 2px;letter-spacing:-.01em}
.card .sub{color:var(--ink-3);font-size:13px;margin:0 0 14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card-head .sub{margin:0}
/* Hero */
.hero{background:linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 120%);color:#fff;border-radius:26px;padding:22px 22px 12px;box-shadow:0 18px 40px -18px rgba(30,60,200,.55);overflow:hidden;position:relative}
.hero .label{opacity:.78;font-size:14px;font-weight:500}
.hero .big{font-size:clamp(36px,8vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 6px}
.hero .big small{font-size:.5em;font-weight:700;opacity:.7;margin-right:2px;vertical-align:.55em}
.delta{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--hero-a)}
.seg.light{background:var(--surface-2)}
.seg.light button{color:var(--ink-2)}
.seg.light button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart{position:relative;margin:14px -8px 0;touch-action:pan-y}
.chart svg{display:block;width:100%;height:170px;overflow:visible}
.chart .xl{display:flex;justify-content:space-between;padding:4px 8px 6px;font-size:11px;opacity:.7;font-weight:600}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:#fff;color:var(--hero-a);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip span{display:block;font-weight:500;color:#56607A;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:14px}
.stat b{display:block;font-size:19px;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--ink-3);font-weight:500}
/* Donut */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none;margin:0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-size:18px;letter-spacing:-.02em;display:block}
.donut .c span{font-size:11.5px;color:var(--ink-3)}
.legend{flex:1;min-width:180px;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .v{font-weight:700}
.legend .p{color:var(--ink-3);font-size:12px;margin-left:6px;font-weight:500}
/* Lists */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row.btn{width:100%;border:0;background:none;text-align:left;padding:12px 6px;border-radius:14px;border-top:1px solid var(--line)}
.row.btn:hover{background:var(--surface-2)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:700;white-space:nowrap}
.row .amt .s{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.Activa{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.Pausada{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.Cancelada{background:color-mix(in srgb,var(--ink-3) 18%,transparent);color:var(--ink-3)}
.day{width:42px;text-align:center;flex:none}
.day b{display:block;font-size:17px;line-height:1}
.day span{font-size:10.5px;color:var(--ink-3);font-weight:600}
.row.past{opacity:.5}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}
.remaining{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:6px;font-weight:600}
.month-group{padding:10px 0;border-top:1px solid var(--line)}
.month-group:first-child{border-top:0}
.month-group .mh{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.month-group .mh span{color:var(--ink-3);font-weight:600;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.empty{text-align:center;padding:36px 12px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.btn-p{border:0;background:var(--primary);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px}
.btn-s{border:1px solid var(--line);background:var(--surface);font-weight:700;padding:10px 16px;border-radius:12px}
.btn-d{border:0;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-weight:700;padding:11px 16px;border-radius:12px}
.cat-sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);font-weight:700;padding:14px 6px 4px}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@media (min-width:880px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:88%}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.detail-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.detail-top .av{width:54px;height:54px;font-size:21px;border-radius:17px}
.detail-top h3{margin:0;font-size:20px;letter-spacing:-.02em}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;margin:0}
.kv dt,.kv dd{padding:9px 0;border-top:1px solid var(--line);margin:0;font-size:14px}
.kv dt{color:var(--ink-2)}
.kv dd{font-weight:700;text-align:right}
.big-cost{background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big-cost b{display:block;font-size:20px;letter-spacing:-.02em}
.big-cost span{font-size:12px;color:var(--ink-3);font-weight:600}
.note{background:var(--primary-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.actions .grow{flex:1}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f .full{grid-column:1/-1}
form.f label{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
form.f input,form.f select,form.f textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;font-weight:600;font-size:15px;width:100%;min-width:0}
form.f textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--ink-3);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner button{border:0;background:var(--surface);font-weight:700;padding:6px 12px;border-radius:10px}
.btn-s{white-space:nowrap}
@media (max-width:560px){.bl{display:none}}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:700;color:var(--ink-2)}
.monthnav button:disabled{opacity:.35;cursor:default}
.monthnav b{min-width:128px;text-align:center}
.split{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.85;font-weight:600;margin:2px 0 8px}
.split i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:1px}
.hbars{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hbars li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.hbars .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbars .bar i{display:block;height:100%;border-radius:99px}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-3);padding:14px 6px 2px}
.amount-in{display:flex;align-items:baseline;gap:6px;background:var(--surface-2);border-radius:16px;padding:12px 16px}
.amount-in span{font-size:28px;font-weight:800;color:var(--ink-3)}
.amount-in input{border:0!important;background:none!important;padding:0!important;font-size:34px!important;font-weight:800!important;letter-spacing:-.03em;width:100%}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.catgrid label{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px!important;color:var(--ink)!important;cursor:pointer}
.catgrid input{position:absolute;opacity:0;width:1px!important;height:1px}
.catgrid i{width:10px;height:10px;border-radius:3px;flex:none}
.catgrid label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.catgrid label:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:700;padding:4px 0;font-size:13.5px}
.backup-actions{display:grid;gap:10px;margin-top:6px}
.backup-actions button{text-align:left;display:flex;gap:12px;align-items:center;padding:14px;white-space:normal;min-width:0;width:100%}
.backup-actions button>span:last-child{min-width:0;flex:1}
.backup-actions small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:none}
.seg3{display:flex;width:100%;max-width:340px}
.seg3 button{flex:1}
:root{--var-c:#22B8CF}
.hist{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:6px;margin-top:6px}
.hcol{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;padding:4px 0;border-radius:10px;cursor:pointer}
.hcol:hover{background:var(--surface-2)}
.hcol.on{background:var(--primary-soft)}
.hval{font-size:10px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.hbar{width:70%;max-width:32px;display:flex;flex-direction:column;border-radius:7px 7px 3px 3px;overflow:hidden;background:var(--surface-2)}
.hbar i{display:block;width:100%}
.hbar .hf{background:var(--primary)}
.hbar .hv{background:var(--var-c)}
.hcol:not(.on) .hbar{opacity:.55}
.hlbl{font-size:11px;font-weight:700;color:var(--ink-2)}
@media (max-width:560px){.hval{display:none}}
.compare{margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
.compare>div:first-child{display:flex;justify-content:space-between;font-size:15px}
.compare>div:first-child span{font-weight:800}
.delta2{font-size:13.5px;color:var(--ink-2);margin-top:4px;font-weight:600}
.delta2.up,.amt.up{color:var(--bad)}
.delta2.down,.amt.down{color:var(--good)}
.ht{display:flex;align-items:center;gap:6px;margin:0 0 2px}
.ibtn{border:0;background:none;padding:2px;color:var(--ink-3);display:inline-grid;place-items:center;border-radius:50%;cursor:pointer}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{color:var(--primary)}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.inline-field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--ink-2)}
.inline-field span{white-space:nowrap}
.inline-field select{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:8px 10px;font-weight:600;font-size:15px}
.picker{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;font-weight:600;font-size:15px;text-align:left;min-width:0}
.picker span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mpanel{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.mpanel[hidden]{display:none}
.mbusca{border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:var(--surface)!important}
.mlista{max-height:260px;overflow:auto;padding:4px 0}
.mgrp{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:10px 12px 4px;text-transform:uppercase;letter-spacing:.04em}
.mopt{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;padding:9px 12px;text-align:left;font-size:14.5px}
.mopt b{min-width:38px}
.mopt span{color:var(--ink-2)}
.mopt:hover,.mopt.on{background:var(--primary-soft)}
html.modal-open,html.modal-open body{overflow:hidden}
.sheet{overscroll-behavior:contain}
.mlista{overscroll-behavior:contain}
select.nat{display:none!important}
.dd{position:relative;min-width:0}
.dd .mpanel{position:absolute;left:0;top:calc(100% + 4px);z-index:30;min-width:100%;width:max-content;max-width:min(320px,86vw)}

(function(){
const APP_VERSION="1.71";
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  if(c&&c.var&&c.var.length){VCATS=c.var.map(x=>x.n);VCAT_COLOR={};c.var.forEach(x=>VCAT_COLOR[x.n]=x.c)}else{VCATS=[...VCATS_DEF];VCAT_COLOR={...VCAT_COLOR_DEF}}
  if(c&&c.fij&&c.fij.length){CATS=c.fij.map(x=>x.n);CAT_COLOR={};c.fij.forEach(x=>CAT_COLOR[x.n]=x.c)}else{CATS=[...CATS_DEF];CAT_COLOR={...CAT_COLOR_DEF}}
  if(!VCAT_COLOR.Otro)VCAT_COLOR.Otro="#94A3B8";if(!CAT_COLOR.Otro)CAT_COLOR.Otro="#94A3B8"}
const TIPOS_CTA={credito:"Tarjeta de crédito",debito:"Tarjeta de débito",corriente:"Cuenta corriente o vista",efectivo:"Efectivo",otro:"Otro"};

const TABS=[
  {id:"inicio",label:"Resumen",icon:'<path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/>'},
  {id:"mov",label:"Variables",icon:'<path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/>'},

];

let ui={tab:"inicio",heroMode:"total",filter:"Todas",q:"",vq:"",vf:{cat:"",medio:"",desde:"",hasta:""},vfOpen:false,loaded:false,vmes:mkey(today),histN:6,histCat:"Todas",histSel:null,oculto:false};
try{ui.oculto=localStorage.getItem("mis-gastos-oculto")==="1";const t=sessionStorage.getItem("luka-tab");if(t)ui.tab=t}catch(e){}
let store=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let _fmt={};
function fmtBase(){const b=base();if(!_fmt[b]){try{_fmt[b]=new Intl.NumberFormat("es-CL",{style:"currency",currency:b,currencyDisplay:["CLP","USD"].includes(b)?"symbol":"narrowSymbol"})}catch(e){_fmt[b]=new Intl.NumberFormat("es-CL",{maximumFractionDigits:2})}}return _fmt[b]}
const simbolo=()=>{const p=fmtBase().formatToParts(1).find(x=>x.type==="currency");return p?p.value:base()};
const clp=n=>ui.oculto?simbolo()+" •••••":fmtBase().format(isFinite(n)?(n||0):0);
const montoOrig=(v,m)=>ui.oculto?"••••• "+m:`${Number(v).toLocaleString("es-CL",{maximumFractionDigits:4})} ${m}`;

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

/* Tasas: unidades de cada moneda por 1 EUR. CLP, USD, UF y UTM vienen del Banco Central (mindicador.cl); el resto, de frankfurter.dev */
function porEUR(){const t=state.tasas||{};
  if(t.porEUR)return t.porEUR;
  if(t.EUR){const o={EUR:1,CLP:t.EUR};if(t.USD)o.USD=t.EUR/t.USD;if(t.UF)o.UF=t.EUR/t.UF;return o}
  return {EUR:1}}
function tasaOK(m){const pe=porEUR();return !m||m===base()||(pe[m]>0&&pe[base()]>0)}
function toBase(monto,moneda){const a=Number(monto)||0;const m=moneda||"CLP",b=base();if(m===b)return a;
  const pe=porEUR();if(!(pe[m]>0&&pe[b]>0))return 0;return a*pe[b]/pe[m]}
const PERIODOS=[[1,"Mensual"],[2,"Bimestral"],[3,"Trimestral"],[4,"Cuatrimestral"],[6,"Semestral"],[12,"Anual"]];
function per(g){const p=parseInt(g.periodo);if(p>0)return p;return g.modalidad==="Anual"?12:1}
function nombrePer(p){const x=PERIODOS.find(y=>y[0]===p);return x?x[1]:`Cada ${p} meses`}
function anclaPer(g){if(g.inicio)return keyToDate(g.inicio);const i=MESES.indexOf(g.mesCobro);return new Date(2000,i>=0?i:0,1)}
function cobraEnMes(g,d){const p=per(g);if(p===1)return true;const a=anclaPer(g);const dif=(d.getFullYear()-a.getFullYear())*12+d.getMonth()-a.getMonth();return ((dif%p)+p)%p===0}
function proximoMesCobro(g,desde=today){for(let i=0;i<per(g)+1;i++){const d=addM(desde,i);if(cobraEnMes(g,d))return d}return addM(desde,0)}
function textoPer(g){const p=per(g);return p===1?"Mensual":p===12?`Anual, ${MESES[anclaPer(g).getMonth()]}`:`${nombrePer(p)} · próximo en ${MESES[proximoMesCobro(g).getMonth()].toLowerCase()}`}
/* ---- historia de gastos fijos: cada gasto guarda sus versiones anteriores ---- */
const CAMPOS_VER=["valor","moneda","descuento","personas","periodo","modalidad","inicio","mesCobro","dia","estado","proximoPago"];
const archivados=()=>state.archivados||(state.archivados=[]);
function versionEn(g,k){if(g.desde&&k<g.desde)return null;if(g.fin&&k>=g.fin)return null;
  const cur={...g,desde:g.vdesde||null};const l=[...(g.hist||[]),cur];
  for(let i=l.length-1;i>=0;i--){if(!l[i].desde||l[i].desde<=k)return l[i]}return l[0]}
const cobradoYa=g=>{const d=Math.min(Number(g.dia)||1,eom(today).getDate());return today.getDate()>=d&&cobraEnMes(g,today)};
/* guarda la versión anterior si cambió algo que afecta el monto; desde = mes en que rige lo nuevo */
function versionar(ant,nuevo,desde,corregir){
  const cambio=CAMPOS_VER.some(c=>JSON.stringify(ant[c]??null)!==JSON.stringify(nuevo[c]??null));
  if(!cambio){nuevo.hist=ant.hist;nuevo.vdesde=ant.vdesde;return nuevo}
  if(corregir){const camb={};CAMPOS_VER.forEach(c=>{if(c!=="estado"&&JSON.stringify(ant[c]??null)!==JSON.stringify(nuevo[c]??null))camb[c]=nuevo[c]});
    nuevo.hist=(ant.hist||[]).map(h=>({...h,...camb}));nuevo.vdesde=ant.vdesde;return nuevo}
  const vd=ant.vdesde||null;
  if(vd===desde){nuevo.hist=ant.hist;nuevo.vdesde=vd;return nuevo}
  if(ant.desde&&desde<=ant.desde){nuevo.hist=ant.hist;nuevo.vdesde=ant.vdesde;return nuevo}
  const snap={desde:vd};CAMPOS_VER.forEach(c=>{if(ant[c]!==undefined)snap[c]=ant[c]});
  nuevo.hist=[...(ant.hist||[]),snap];nuevo.vdesde=desde;return nuevo}
function calc(g){
  const enClp=toBase(g.valor,g.moneda);
  const conDesc=enClp*(1-(Number(g.descuento)||0));
  const pp=conDesc/Math.max(1,Number(g.personas)||1);
  return {enClp,conDesc,pp,anual:pp*12/per(g)};
}
function gastoMes(d,incluirReactivaciones=true){
  const mes=MESES[d.getMonth()],fin=eom(d),k=mkey(d);let s=0;
  for(const g0 of [...state.gastos,...archivados()]){const g=versionEn(g0,k);if(!g)continue;const c=calc(g);
    if(g.estado==="Activa"&&cobraEnMes(g,d))s+=c.pp;
    else if(incluirReactivaciones&&g.estado==="Pausada"&&g.proximoPago&&parseD(g.proximoPago)<=fin&&cobraEnMes(g,d))s+=c.pp;}
  return s;
}
const varsMes=k=>(state.vars[k]||[]);
/* movimientos que afectan un mes: compras del mes (o su 1ª cuota) + cuotas de compras anteriores */
const nCuotas=v=>Math.max(1,parseInt(v.cuotas)||1);
function movsMes(k){const out=[];
  varsMes(k).forEach(v=>{const n=nCuotas(v);out.push({v,m:toBase(v.monto,v.moneda)/n,cuota:n>1?1:0,n,fecha:v.fecha})});
  const d0=keyToDate(k);
  for(const [kk,l] of Object.entries(state.vars)){if(kk>=k)continue;const dk=keyToDate(kk);const dif=(d0.getFullYear()-dk.getFullYear())*12+d0.getMonth()-dk.getMonth();
    l.forEach(v=>{const n=nCuotas(v);if(n>1&&dif<n){const dd=parseD(v.fecha);const f=new Date(dd.getFullYear(),dd.getMonth()+dif,Math.min(dd.getDate(),eom(d0).getDate()));out.push({v,m:toBase(v.monto,v.moneda)/n,cuota:dif+1,n,fecha:iso(f),arrastre:true})}})}
  return out}
const totalVar=k=>movsMes(k).reduce((a,x)=>a+x.m,0);
const cuotasMes=k=>movsMes(k).filter(x=>x.arrastre).reduce((a,x)=>a+x.m,0);
function cobraEsteMes(g,d=today){return g.estado==="Activa"&&cobraEnMes(g,d)}
function totales(){
  const act=state.gastos.filter(g=>g.estado==="Activa");
  let anual=0;act.forEach(g=>{anual+=calc(g).anual});
  const fijos=gastoMes(today,false),vari=totalVar(mkey(today));
  return {fijos,vari,real:fijos+vari,anual,activas:act.length,mensuales:act.filter(g=>per(g)===1).length,anuales:act.filter(g=>per(g)>1).length};
}
function porCategoria(){
  const m={};CATS.forEach(c=>m[c]=0);
  state.gastos.forEach(g=>{if(g.estado!=="Activa")return;const c=calc(g);
    const v=cobraEsteMes(g)?c.pp:0;m[g.categoria in m?g.categoria:"Otro"]+=v});
  return CATS.map(c=>({cat:c,v:m[c],color:CAT_COLOR[c]})).filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v);
}
function varPorCategoria(k){
  const m={};movsMes(k).forEach(x=>{const c=VCATS.includes(x.v.categoria)?x.v.categoria:"Otro";m[c]=(m[c]||0)+x.m});
  return Object.entries(m).map(([cat,v])=>({cat,v,color:VCAT_COLOR[cat]})).sort((a,b)=>b.v-a.v);
}
function proximos(nMeses=12){
  const out=[];
  for(let i=1;i<=nMeses;i++){const d=addM(today,i),mes=MESES[d.getMonth()],fin=eom(d),ini=new Date(d.getFullYear(),d.getMonth(),1);const items=[];
    state.gastos.forEach(g=>{const c=calc(g);
      if(g.estado==="Activa"&&per(g)>1&&cobraEnMes(g,d))items.push({g,v:c.pp,tipo:per(g)===12?"Pago anual":`Pago ${nombrePer(per(g)).toLowerCase()}`});
      if(g.estado==="Pausada"&&g.proximoPago){const p=parseD(g.proximoPago);if(p>=ini&&p<=fin)items.push({g,v:c.pp,tipo:"Se reactiva"})}});
    if(items.length)out.push({d,items,total:gastoMes(d)});}
  return out;
}

function migrarCuentas(){if(Array.isArray(state.cuentas))return;
  const tipoDe=x=>x.medio==="Crédito"?"credito":x.medio==="Débito"?"debito":x.medio==="Efectivo"?"efectivo":"otro";
  const corto={credito:"crédito",debito:"débito",efectivo:"efectivo",otro:"otro"};
  const todos=[...state.gastos,...Object.values(state.vars||{}).flat()];const tipos={};
  todos.forEach(x=>{const n=(x.cuenta||"").trim();if(n)(tipos[n]=tipos[n]||new Set()).add(tipoDe(x))});
  const lista=[],ren={};
  for(const [n,set] of Object.entries(tipos)){const ts=[...set];
    if(ts.length===1)lista.push({id:uid("c"),nombre:n,tipo:ts[0],diaFact:null});
    else ts.forEach(t=>{const nn=`${n} · ${corto[t]}`;ren[n+"|"+t]=nn;lista.push({id:uid("c"),nombre:nn,tipo:t,diaFact:null})})}
  const fix=x=>{const n=(x.cuenta||"").trim();const nn=ren[n+"|"+tipoDe(x)];return nn?{...x,cuenta:nn}:x};
  if(Object.keys(ren).length){state.gastos=state.gastos.map(fix);for(const k of Object.keys(state.vars||{}))state.vars[k]=state.vars[k].map(fix)}
  state.cuentas=lista}
function migrarPlan(){let c=0;state.gastos=state.gastos.map(g=>{if(!g.plan)return g;c++;const {plan,...r}=g;return {...r,notas:`Plan: ${plan}`+(g.notas?` · ${g.notas}`:"")}});return c}

/* Valores de conversión: mindicador.cl (Banco Central de Chile) + frankfurter.dev (bancos centrales del mundo) */
let tasasEstado="";
async function getJSON(url){const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),12000);
  try{const r=await fetch(url,{signal:ctrl.signal,cache:"no-store"});if(!r.ok)throw new Error("http "+r.status);return await r.json()}finally{clearTimeout(to)}}
async function actualizarTasas(forzar){
  const t=state.tasas||{};
  const hace=t.consultado?(Date.now()-t.consultado)/36e5:1e9;
  if(!forzar&&hace<6&&t.porEUR)return;
  tasasEstado="cargando";if(ui.tab==="ajustes")render();
  const [fx,cl]=await Promise.allSettled([getJSON("https://api.frankfurter.dev/v2/rates"),getJSON("https://mindicador.cl/api")]);
  const pe={...(t.porEUR||porEUR())},fe={...(t.fechas||{})};let ok=0;
  if(fx.status==="fulfilled"&&Array.isArray(fx.value)){fx.value.forEach(r=>{if(MONEDAS.includes(r.quote)&&r.rate>0){pe[r.quote]=r.rate;fe[r.quote]=r.date}});pe.EUR=1;ok++}
  if(cl.status==="fulfilled"&&cl.value&&cl.value.euro&&cl.value.euro.valor){const j=cl.value,eur=j.euro.valor,f=x=>x&&x.fecha?iso(new Date(x.fecha)):"";
    pe.CLP=eur;fe.CLP=f(j.euro);
    [["USD","dolar"],["UF","uf"],["UTM","utm"]].forEach(([c,k])=>{if(j[k]&&j[k].valor>0){pe[c]=eur/j[k].valor;fe[c]=f(j[k])}});ok++}
  if(ok){state.tasas={porEUR:pe,fechas:fe,consultado:Date.now(),parcial:ok<2};guardarLocal();tasasEstado=ok<2?"parcial":""}
  else tasasEstado="error";
  render();
}

}

/* exportar cobros fijos a un calendario (.ics) */
function generarICS(){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Luka//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Luka"];
  const icsEsc=t=>String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const monto=g=>{const c=calc(g);const o=ui.oculto;ui.oculto=false;const t=clp(c.pp);ui.oculto=o;return t};
  const ev=(uidx,inicio,titulo,desc,rrule)=>{const fin=new Date(inicio);fin.setDate(fin.getDate()+1);
    L.push("BEGIN:VEVENT","UID:"+uidx+"@mis-gastos","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+f(inicio),"DTEND;VALUE=DATE:"+f(fin),"SUMMARY:"+icsEsc(titulo),"DESCRIPTION:"+icsEsc(desc));
    if(rrule)L.push("RRULE:"+rrule);
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(titulo),"TRIGGER:-PT15H","END:VALARM","END:VEVENT")};
  let n=0;
  state.gastos.forEach(g=>{const dia=Math.min(Math.max(Number(g.dia)||1,1),31);const c=calc(g);if(c.pp<1)return;
    const dias=Array.from({length:dia-27},(_,i)=>28+i).join(",");
    const diaRule=dia>28?`BYMONTHDAY=${dias};BYSETPOS=-1`:`BYMONTHDAY=${dia}`;
    const desc=`${g.categoria}${g.medio?" · "+g.medio:""}${g.cuenta?" · "+g.cuenta:""}. Monto aproximado: puede variar con la UF o el tipo de cambio.`;
    if(g.estado==="Activa"&&per(g)===1){const ini=new Date(today.getFullYear(),today.getMonth(),Math.min(dia,eom(today).getDate()));
      ev("m-"+g.id,ini,`Cobro: ${g.nombre} (${monto(g)})`,desc,`FREQ=MONTHLY;${diaRule}`);n++}
    else if(g.estado==="Activa"){const pm=proximoMesCobro(g,addM(today,0));const ini=new Date(pm.getFullYear(),pm.getMonth(),Math.min(dia,eom(pm).getDate()));const p=per(g);
      ev((p===12?"a-":"p-")+g.id,ini,`${p===12?"Pago anual":"Pago "+nombrePer(p).toLowerCase()}: ${g.nombre} (${monto(g)})`,desc,`FREQ=MONTHLY;INTERVAL=${p};${diaRule}`);n++}
    else if(g.estado==="Pausada"&&g.proximoPago){ev("r-"+g.id,parseD(g.proximoPago),`Se reactiva: ${g.nombre} (${monto(g)})`,desc,null);n++}});
  L.push("END:VCALENDAR");
  const plegar=l=>{const out=[];let x=l;while(new TextEncoder().encode(x).length>73){let i=Math.min(x.length,70);while(new TextEncoder().encode(x.slice(0,i)).length>73)i--;out.push(x.slice(0,i));x=" "+x.slice(i)}out.push(x);return out.join("\r\n")};
  return {texto:L.map(plegar).join("\r\n"),n};
}
async function exportarCalendario(){
  const {texto,n}=generarICS();if(!n){toast("No hay cobros fijos para exportar");return}
  const file=new File([texto],"Luka - cobros.ics",{type:"text/calendar"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Cobros de Luka"});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  toast(`${n} cobros exportados`);
}

function smoothPath(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i],mx=(x0+x1)/2;d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`}return d}
/* datos del gráfico principal según el modo: fijos, total o variables */
function heroData(modo){
  const data=[];let cur=0;

    cur=data.length-1;
    const prev=data.slice(0,-1).filter(x=>x.v>0);

  }
  for(let i=-3;i<=12;i++){const d=addM(today,i);
    const fij=gastoMes(d,i!==0);

}
function heroChart(modo){

      ${avg?`<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#7FD3FF" stroke-opacity=".9" stroke-width="1.5" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>`:""}

function bindHeroChart(ch){

    const w=document.createElement("div");w.className="dd"+(sel.dataset.compact?" compact":"");

    w.innerHTML=`<button type="button" class="picker" aria-haspopup="listbox" aria-expanded="false"><span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="mpanel" hidden>${busca?`<input type="search" class="mbusca" placeholder="${sel.dataset.buscar||"Buscar…"}" aria-label="Buscar">`:""}<div class="mlista" role="listbox"></div></div>`;
    sel.after(w);

    const sync=()=>{const o=sel.options[sel.selectedIndex];btn.querySelector("span").textContent=o?o.textContent:""};
    sel._ddSync=sync;sync();
    const pintar=()=>{const q=bus?sinAcento(bus.value.trim()):"";let html="";

      lis.innerHTML=html||`<p class="sub" style="padding:10px 12px;margin:0">Sin resultados</p>`};
    const cerrar=()=>{pan.hidden=true;btn.setAttribute("aria-expanded","false")};
    btn.addEventListener("click",e=>{e.stopPropagation();const abrir=pan.hidden;document.querySelectorAll(".dd .mpanel:not([hidden])").forEach(x=>{x.hidden=true});
      if(!abrir)return;pan.hidden=false;btn.setAttribute("aria-expanded","true");if(bus)bus.value="";pintar();
      const r=w.getBoundingClientRect();pan.classList.toggle("der",r.left>window.innerWidth/2);
      if(bus)bus.focus();const on=lis.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"});
      setTimeout(()=>pan.scrollIntoView({block:"nearest",behavior:"smooth"}),30)});
    if(bus){bus.addEventListener("input",pintar);bus.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const f=lis.querySelector(".mopt");if(f)f.click()}})}

    lis.addEventListener("click",e=>{const o=e.target.closest(".mopt");if(!o)return;e.stopPropagation();
      sel.value=o.dataset.v;sync();cerrar();btn.focus();sel.dispatchEvent(new Event("change",{bubbles:true}))});
  });
}

const XLSX_COLS="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const colL=i=>i<26?XLSX_COLS[i]:XLSX_COLS[Math.floor(i/26)-1]+XLSX_COLS[i%26];
const colI=l=>l.split("").reduce((a,c)=>a*26+c.charCodeAt(0)-64,0)-1;
const xesc=s=>String(s??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const toSerial=s=>{const d=parseD(s);return d?Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/864e5):null};
const fromSerial=n=>{const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())};
const parseXml=s=>new DOMParser().parseFromString(s,"application/xml");
const resolvePath=(base,t)=>{if(t.startsWith("/"))return t.slice(1);const parts=base.split("/");parts.pop();t.split("/").forEach(p=>{if(p==="..")parts.pop();else if(p!==".")parts.push(p)});return parts.join("/")};
async function relsOf(zip,path){const rp=path.replace(/([^/]+)$/,"_rels/$1.rels");const f=zip.file(rp);if(!f)return[];const x=parseXml(await f.async("string"));return [...x.getElementsByTagName("Relationship")].map(r=>({id:r.getAttribute("Id"),type:r.getAttribute("Type"),target:resolvePath(path,r.getAttribute("Target")),mode:r.getAttribute("TargetMode")}))}
async function sheetMap(zip){
  const wb=parseXml(await zip.file("xl/workbook.xml").async("string"));const rels=await relsOf(zip,"xl/workbook.xml");const m={};
  [...wb.getElementsByTagName("sheet")].forEach(s=>{const rid=s.getAttribute("r:id")||s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");const r=rels.find(x=>x.id===rid);if(r)m[s.getAttribute("name")]=r.target});

async function tableOf(zip,sheetPath,nombre){const rs=(await relsOf(zip,sheetPath)).filter(x=>/\/table$/.test(x.type));let r=rs[0];
  if(nombre){r=null;for(const x of rs){const t=await zip.file(x.target).async("string");if(new RegExp(`displayName="${nombre}"`).test(t)){r=x;break}}}
  if(!r)return null;
  const xml=await zip.file(r.target).async("string");const x=parseXml(xml);
  const cols=[...x.getElementsByTagName("tableColumn")].map(c=>{const f=c.getElementsByTagName("calculatedColumnFormula")[0];return {name:c.getAttribute("name"),formula:f?f.textContent:null}});

async function fillTable(zip,sheetPath,rows,valueFor,nombre){
  const tb=await tableOf(zip,sheetPath,nombre);if(!tb)throw new Error("tabla");
  let sx=await zip.file(sheetPath).async("string");
  const [a1,b1]=tb.ref.split(":");const c0=colI(a1.match(/[A-Z]+/)[0]),r0=Number(a1.match(/\d+/)[0]);const lastC=c0+tb.cols.length-1;
  const rowRe=n=>new RegExp(`<row [^>]*r="${n}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`);
  const tmpl=(sx.match(rowRe(r0+1))||[""])[0];
  const rowAttrs=(tmpl.match(/^<row ([^>]*?)\/?>/)||["",'r="0"'])[1].replace(/\s*r="\d+"/,"");
  const styles={};(tmpl.match(/<c [^>]*?(?:\/>|>)/g)||[]).forEach(c=>{const r=(c.match(/r="([A-Z]+)\d+"/)||[])[1];const s=(c.match(/ s="(\d+)"/)||[])[1];if(r&&s)styles[r]=s});
  const out=[];const n=Math.max(rows.length,1);
  for(let i=0;i<n;i++){const rn=r0+1+i;let cells="";
    tb.cols.forEach((col,j)=>{const L=colL(c0+j),ref=L+rn,st=styles[L]?` s="${styles[L]}"`:"";
      let v=rows[i]?valueFor(rows[i],col.name):undefined;
      if(v===undefined&&col.formula&&rows[i]!==undefined){cells+=`<c r="${ref}"${st}><f>${xesc(col.formula)}</f></c>`;return}
      if(v===undefined&&col.formula&&!rows.length){cells+=`<c r="${ref}"${st}><f>${xesc(col.formula)}</f></c>`;return}
      if(v===null||v===undefined||v===""){cells+=`<c r="${ref}"${st}/>`;return}
      if(typeof v==="number"&&isFinite(v))cells+=`<c r="${ref}"${st}><v>${v}</v></c>`;
      else cells+=`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`});
    out.push(`<row r="${rn}" ${rowAttrs}>${cells}</row>`)}
  const lastR=r0+n;

  sx=sx.replace(/<sheetData>([\s\S]*?)<\/sheetData>|<sheetData\/>/,(m,body)=>{
    const rowsXml=(body||"").match(/<row [\s\S]*?(?:<\/row>|\/>)(?=<row |$)/g)||[];

      const cs=(rx.match(/<c [^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)||[]).filter(c=>{const L=(c.match(/r="([A-Z]+)\d+"/)||[])[1];const ci=L?colI(L):-1;return (ci>lastC||ci<c0)&&/<[fv]>|<is>/.test(c)});
      if(cs.length)extra[rn]=cs});
    const ordenar=rx=>{const m=rx.match(/^(<row [^>]*>)([\s\S]*)<\/row>$/);if(!m)return rx;const cs=m[2].match(/<c [^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)||[];cs.sort((a,b)=>colI(a.match(/r="([A-Z]+)/)[1])-colI(b.match(/r="([A-Z]+)/)[1]));return m[1]+cs.join("")+"</row>"};
    const merged=out.map(rx=>{const rn=Number(rx.match(/r="(\d+)"/)[1]);if(extra[rn]){const add=extra[rn].join("");delete extra[rn];return ordenar(rx.replace("</row>",add+"</row>"))}return rx});
    Object.keys(extra).map(Number).sort((a,b)=>a-b).forEach(rn=>{const r=`<row r="${rn}">${extra[rn].join("")}</row>`;const idx=merged.findIndex(x=>Number(x.match(/r="(\d+)"/)[1])>rn);if(idx<0)merged.push(r);else merged.splice(idx,0,r)});
    return "<sheetData>"+keep.join("")+merged.join("")+"</sheetData>"});
  sx=sx.replace(/<dimension ref="[^"]*"\/>/,`<dimension ref="A1:${colL(Math.max(lastC,25))}${Math.max(lastR,r0+12)}"/>`);
  zip.file(sheetPath,sx);
  const nref=`${a1}:${colL(lastC)}${lastR}`;
  zip.file(tb.path,tb.xml.replace(/(<table [^>]*?ref=")[^"]+"/,`$1${nref}"`).replace(/(<autoFilter [^>]*?ref=")[^"]+"/,`$1${nref}"`));
}
async function dropCalcChain(zip){
  zip.remove("xl/calcChain.xml");
  let r=await zip.file("xl/_rels/workbook.xml.rels").async("string");r=r.replace(/<Relationship [^>]*calcChain[^>]*\/>/g,"");zip.file("xl/_rels/workbook.xml.rels",r);
  let ct=await zip.file("[Content_Types].xml").async("string");ct=ct.replace(/<Override [^>]*calcChain[^>]*\/>/g,"");zip.file("[Content_Types].xml",ct);
  let wb=await zip.file("xl/workbook.xml").async("string");
  wb=/<calcPr[^>]*fullCalcOnLoad/.test(wb)?wb:wb.replace(/<calcPr([^>]*?)\/>/,'<calcPr$1 fullCalcOnLoad="1"/>');zip.file("xl/workbook.xml",wb);
}
const GASTO_MAP={"Suscripción":g=>g.nombre,"Tipo de plan":g=>null,"Categoría":g=>g.categoria,"Modalidad":g=>per(g)===1?"Mensual":per(g)===12?"Anual":nombrePer(per(g)),"N° de cuotas pagadas":g=>Number(g.cuotasPagadas)||0,"N° total de cuotas":g=>Number(g.cuotasTotal)||1,"N° de personas que pagan":g=>Number(g.personas)||1,"Personas que comparten":g=>(g.comparten||[]).join(", ")||null,"Moneda de cobro":g=>g.moneda,"Valor":g=>Number(g.valor)||0,"Descuento":g=>Number(g.descuento)||0,"Mes de cobro":g=>per(g)===1?"Todos":MESES[anclaPer(g).getMonth()],"Día de cobro":g=>Number(g.dia)||null,"Estado":g=>g.estado,"Fecha del último pago":g=>toSerial(g.ultimoPago),"Fecha en que vence el próximo pago":g=>toSerial(g.proximoPago),"Medio de pago":g=>g.medio||null,"Tarjeta o cuenta utilizada":g=>g.cuenta||null,"Notas":g=>g.notas||null};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("mis-gastos",1);r.onupgradeneeded=()=>r.result.createObjectStore("archivos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function baseGet(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction("archivos").objectStore("archivos").get("base");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function baseSet(file,desdeDropbox){try{const buf=await file.arrayBuffer();const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("archivos","readwrite");tx.objectStore("archivos").put({nombre:file.name,datos:buf},"base");tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});meta.nombreBase=file.name;meta.baseEnDropbox=!!desdeDropbox;saveMeta();
  if(meta.dbxRefresh&&!desdeDropbox){dbxSubirArchivo("/Archivo base.xlsx",new Blob([buf])).then(()=>{meta.baseEnDropbox=true;saveMeta()}).catch(()=>{});scheduleSync()}}catch(e){}}
function pickFile(){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";i.style.display="none";i.onchange=()=>{res(i.files[0]||null);i.remove()};document.body.appendChild(i);i.click()})}
async function generarExcel(file){
  const zip=await JSZip.loadAsync(file);const sm=await sheetMap(zip);
  if(!sm["Gastos"])throw new Error("sin-gastos");
  if(!sm["Gastos variables"])throw new Error("sin-variables");
  await fillTable(zip,sm["Gastos"],state.gastos,(g,name)=>GASTO_MAP[name]?GASTO_MAP[name](g):undefined);
  const all=Object.keys(state.vars).sort().flatMap(k=>[...state.vars[k]].sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.creado||0)-(b.creado||0)));
  await fillTable(zip,sm["Gastos variables"],all,(v,name)=>VAR_MAP[name]?VAR_MAP[name](v):undefined);
  if(sm["Aux"]&&await tableOf(zip,sm["Aux"],"tblTasas")){
    const pe=porEUR(),fe=(state.tasas&&state.tasas.fechas)||{};
    const filas=MONEDAS.filter(c=>pe[c]>0);
    await fillTable(zip,sm["Aux"],filas,(c,name)=>name==="Moneda"?c:name==="Por EUR (app)"?pe[c]:name==="Fecha (app)"?toSerial(fe[c]||iso(today)):undefined,"tblTasas");
    const wbx=await zip.file("xl/workbook.xml").async("string");
    const dn=(wbx.match(/<definedName name="MonedaBase"[^>]*>([^<]*)<\/definedName>/)||[])[1]||"Resumen!$B$2";
    const mm=dn.match(/^'?([^'!]+)'?!\$?([A-Z]+)\$?(\d+)$/);
    if(mm&&sm[mm[1]]){const ref=mm[2]+mm[3];let rx=await zip.file(sm[mm[1]]).async("string");
      rx=rx.replace(new RegExp(`<c r="${ref}"([^>]*?)(?:\\/>|>[\\s\\S]*?<\\/c>)`),(m,at)=>`<c r="${ref}"${at.replace(/\s*t="[^"]*"/,"")} t="inlineStr"><is><t>${base()}</t></is></c>`);
      zip.file(sm[mm[1]],rx)}
  }else if(base()!=="CLP")throw new Error("excel-v1");
  await dropCalcChain(zip);
  return zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function doBackup(forzarNuevo){
  let file=null,base=forzarNuevo?null:await baseGet();
  if(base){file=new File([base.datos],base.nombre)}else{file=await pickFile();if(!file)return}
  try{
    const blob=await generarExcel(file);
    if(!base)await baseSet(file);
    const nombre=file.name.replace(/\.xlsx$/i,"").replace(/\s*\(respaldo[^)]*\)$/i,"");
    await saveFile(`${nombre} (respaldo ${iso(today)}).xlsx`,blob);
    meta.ultimoRespaldo=iso(today);saveMeta();render();toast("Respaldo descargado en tu carpeta de descargas");
  }catch(e){console.error(e);
    if(e.message==="sin-variables")openSheet(`<h3 style="margin:0 0 8px">Falta la hoja de gastos variables</h3><p class="sub" style="margin:0 0 14px">Este archivo es una versión anterior del Registro de gastos. Usa la versión 1.4, que tiene la hoja "Gastos variables".</p><div class="actions"><button class="btn-p grow" data-close>Entendido</button></div>`);
    else if(e.message==="sin-gastos")toast("Este archivo no tiene la hoja Gastos");
    else if(e.message==="excel-v1")openSheet(`<h3 style="margin:0 0 8px">Necesitas el Excel 2.0</h3><p class="sub" style="margin:0 0 14px">Tu moneda principal es ${baseMon()}, pero tu archivo base solo sabe calcular en pesos chilenos. Carga la versión 2.0 del Registro de gastos como archivo base.</p><div class="actions"><button class="btn-p grow" data-close>Entendido</button></div>`);
    else toast("No se pudo leer el archivo. ¿Es un Excel .xlsx?")}
}

const DBX_EXCEL="/Registro de gastos (respaldo automático).xlsx",DBX_DATOS="/datos-app.json";
let dbxToken=null,dbxExp=0,syncTimer=null,sincronizando=false,ultimaBajada=0,dbxEstado="";
const redirectUri=()=>location.origin+location.pathname;
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const argHdr=o=>JSON.stringify(o).replace(/[\u007f-\uffff]/g,c=>"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"));
async function dbxConectar(key){
  key=(key||"").trim();if(!/^[a-z0-9]{8,32}$/i.test(key)){toast("Esa App key no parece válida");return}
  meta.dbxKey=key;saveMeta();
  const ver=b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  try{localStorage.setItem("mis-gastos-pkce",ver)}catch(e){}
  location.href="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:key,response_type:"code",code_challenge:ch,code_challenge_method:"S256",redirect_uri:redirectUri(),token_access_type:"offline"});
}
async function dbxRedirect(){
  const q=new URLSearchParams(location.search);
  if(!q.get("code")&&!q.get("error"))return;
  history.replaceState(null,"",redirectUri());
  if(q.get("error")){toast("No se conectó Dropbox");return}
  let ver="";try{ver=localStorage.getItem("mis-gastos-pkce")||""}catch(e){}
  try{
    const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body:new URLSearchParams({code:q.get("code"),grant_type:"authorization_code",code_verifier:ver,client_id:meta.dbxKey,redirect_uri:redirectUri()})});
    if(!r.ok)throw new Error("token "+r.status);
    const j=await r.json();meta.dbxRefresh=j.refresh_token;dbxToken=j.access_token;dbxExp=Date.now()+(j.expires_in-120)*1000;meta.dbxError="";saveMeta();
    try{localStorage.removeItem("mis-gastos-pkce")}catch(e){}
    toast("Dropbox conectado");ultimaBajada=0;
  }catch(e){meta.dbxError="No se pudo completar la conexión con Dropbox.";saveMeta();render()}
}
async function dbxAcceso(){
  if(dbxToken&&Date.now()<dbxExp)return dbxToken;
  const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body:new URLSearchParams({grant_type:"refresh_token",refresh_token:meta.dbxRefresh,client_id:meta.dbxKey})});
  if(r.status===400||r.status===401){const e=new Error("auth");e.auth=true;throw e}
  if(!r.ok)throw new Error("token "+r.status);
  const j=await r.json();dbxToken=j.access_token;dbxExp=Date.now()+(j.expires_in-120)*1000;return dbxToken;
}
async function dbxSubirArchivo(path,blob){
  const t=await dbxAcceso();
  const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/octet-stream","Dropbox-API-Arg":argHdr({path,mode:"overwrite",mute:true})},body:blob});
  if(!r.ok)throw new Error("upload "+r.status);
}
async function dbxBajarArchivo(path){
  const t=await dbxAcceso();
  const r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{Authorization:"Bearer "+t,"Dropbox-API-Arg":argHdr({path})}});
  if(r.status===409)return null;
  if(!r.ok)throw new Error("download "+r.status);
  return r;
}
function dbxFallo(e){console.error(e);

  else meta.dbxError=navigator.onLine===false?"Sin internet: se sincronizará cuando vuelvas a tener conexión.":"No se pudo sincronizar con Dropbox.";
  saveMeta();
}
function scheduleSync(){if(!meta.dbxRefresh)return;meta.pendiente=true;saveMeta();clearTimeout(syncTimer);syncTimer=setTimeout(dbxSubir,3000)}
async function dbxSubir(){

    await dbxSubirArchivo(DBX_DATOS,new Blob([JSON.stringify(datos)],{type:"application/json"}));
    const base=excelOn()?await baseGet():null;
    if(base){try{const blob=await generarExcel(new File([base.datos],base.nombre));await dbxSubirArchivo(DBX_EXCEL,blob);meta.ultimoRespaldo=iso(today)}catch(e){if(e.message!=="sin-variables"&&e.message!=="excel-v1")throw e}}

async function dbxBajar(forzar,subirSiempre){
  if(!meta.dbxRefresh)return;
  if(!forzar&&Date.now()-ultimaBajada<60000)return;ultimaBajada=Date.now();
  dbxEstado="bajando";if(ui.tab==="ajustes")render();
  try{
    // archivo base de Excel: se comparte entre teléfonos a través de Dropbox
    const base=await baseGet();
    if(!base){const r=await dbxBajarArchivo("/Archivo base.xlsx");if(r){const b=await r.blob();await baseSet(new File([b],"Registro de gastos.xlsx"),true)}}
    else if(!meta.baseEnDropbox){await dbxSubirArchivo("/Archivo base.xlsx",new Blob([base.datos]));meta.baseEnDropbox=true;saveMeta()}
    const r=await dbxBajarArchivo(DBX_DATOS);
    const remoto=r?await r.json():null;
    if(remoto&&remoto.app==="mis-gastos"&&(remoto.modificado||0)>(state.modificado||0)){
      state={...state,gastos:remoto.gastos||[],vars:remoto.vars||{},presupuestos:remoto.presupuestos||state.presupuestos||{},config:remoto.config||state.config||{},cuentas:remoto.cuentas||state.cuentas||[],categorias:remoto.categorias||state.categorias||null,grupos:remoto.grupos||state.grupos||[],archivados:remoto.archivados||state.archivados||[],modificado:remoto.modificado};migrarPlan();aplicarCategorias();guardarLocal();meta.pendiente=false;
      meta.dbxUltima=Date.now();meta.dbxError="";saveMeta();toast("Datos actualizados desde Dropbox");
    }else if(!remoto||(state.modificado||0)>(remoto.modificado||0)||meta.pendiente){dbxEstado="";await dbxSubir();return}
    else{meta.dbxUltima=Date.now();meta.dbxError="";saveMeta()}
    if(subirSiempre){dbxEstado="";await dbxSubir();return}
  }catch(e){dbxFallo(e)}
  dbxEstado="";render();
}
async function dbxDesconectar(){
  try{const t=await dbxAcceso();await fetch("https://api.dropboxapi.com/2/auth/token/revoke",{method:"POST",headers:{Authorization:"Bearer "+t}})}catch(e){}
  dbxToken=null;meta.dbxRefresh="";meta.dbxError="";meta.pendiente=false;meta.baseEnDropbox=false;saveMeta();render();toast("Dropbox desconectado");
}
async function readSheetRows(zip,path,shared){
  const x=parseXml(await zip.file(path).async("string"));const rows=[];
  [...x.getElementsByTagName("row")].forEach(r=>{const rn=Number(r.getAttribute("r"));const obj={};
    [...r.getElementsByTagName("c")].forEach(c=>{const L=c.getAttribute("r").match(/[A-Z]+/)[0];const t=c.getAttribute("t");const v=c.getElementsByTagName("v")[0];let val=null;
      if(t==="s"&&v)val=shared[Number(v.textContent)];else if(t==="inlineStr"){val=[...c.getElementsByTagName("t")].map(n=>n.textContent).join("")}else if(t==="str"||t==="e")val=v?v.textContent:null;else if(t==="b")val=v?v.textContent==="1":null;else if(v&&v.textContent!=="")val=Number(v.textContent);
      obj[L]=val});rows[rn]=obj});
  return rows;
}
async function readTable(zip,sheetPath,shared){
  const tb=await tableOf(zip,sheetPath);if(!tb)return[];
  const [a1,b1]=tb.ref.split(":");const c0=colI(a1.match(/[A-Z]+/)[0]),r0=Number(a1.match(/\d+/)[0]),r1=Number(b1.match(/\d+/)[0]);
  const rows=await readSheetRows(zip,sheetPath,shared);const out=[];
  for(let r=r0+1;r<=r1;r++){const row=rows[r]||{};const o={};tb.cols.forEach((col,j)=>o[col.name]=row[colL(c0+j)]??null);out.push(o)}
  return out;
}
const s=v=>v==null?"":String(v).trim();
const dateIn=v=>typeof v==="number"?fromSerial(v):(/^\d{4}-\d{2}-\d{2}/.test(s(v))?s(v).slice(0,10):(()=>{const m=s(v).match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:""})());
async function doRestore(){

    const zip=await JSZip.loadAsync(file);const sm=await sheetMap(zip);

    if(!sm["Gastos"]){toast("Este archivo no tiene la hoja Gastos");return}
    const gastos=(await readTable(zip,sm["Gastos"],shared)).filter(r=>s(r["Suscripción"])).map((r,i)=>({id:"g"+(i+1).toString().padStart(3,"0")+Math.random().toString(36).slice(2,5),

      cuotasPagadas:Number(r["N° de cuotas pagadas"])||0,cuotasTotal:Number(r["N° total de cuotas"])||1,personas:Number(r["N° de personas que pagan"])||1,
      comparten:s(r["Personas que comparten"]).split(/,|;|\s{2,}/).map(x=>x.trim()).filter(Boolean),moneda:MONEDAS.includes(s(r["Moneda de cobro"]))?s(r["Moneda de cobro"]):"CLP",
      valor:Number(r["Valor"])||0,descuento:Number(r["Descuento"])||0,mesCobro:s(r["Modalidad"])==="Anual"?(s(r["Mes de cobro"])||""):"Todos",dia:Number(r["Día de cobro"])||1,
      estado:ESTADOS.includes(s(r["Estado"]))?s(r["Estado"]):"Activa",ultimoPago:dateIn(r["Fecha del último pago"]),proximoPago:dateIn(r["Fecha en que vence el próximo pago"]),
      medio:s(r["Medio de pago"]),cuenta:s(r["Tarjeta o cuenta utilizada"]),notas:s(r["Notas"])}));
    const vars={};let nv=0;
    if(sm["Gastos variables"]){(await readTable(zip,sm["Gastos variables"],shared)).forEach((r,i)=>{const f=dateIn(r["Fecha"]);const m=Number(r["Monto"]);if(!f||!(m>0))return;

      (vars[f.slice(0,7)]=vars[f.slice(0,7)]||[]).push(v);nv++})}
    const tasas={...state.tasas};
    openSheet(`<h3 style="margin:0 0 8px">¿Reemplazar los datos de la app?</h3><p class="sub" style="margin:0 0 14px">El archivo tiene ${gastos.length} gastos fijos y ${nv} gastos variables. Lo que tienes ahora en la app se reemplazará por esto.</p>${(()=>{const all=Object.values(state.vars).flat();const nc=all.filter(v=>nCuotas(v)>1).length,ng=all.filter(v=>(v.grupos||[]).length).length;const p=[];if(nc)p.push(`${nc} compra${nc===1?"":"s"} en cuotas (quedarían como pago único)`);if(ng)p.push(`la asignación de ${ng} gasto${ng===1?"":"s"} a grupos`);return p.length?`<div class="banner" style="margin:0 0 14px">Este Excel no guarda ${p.join(" ni ")}. Si continúas, se perderán.</div>`:""})()}
      <div class="actions"><button class="btn-p grow" id="confirmRestore">Reemplazar datos</button><button class="btn-s" data-close>Cancelar</button></div>`);
    $("#confirmRestore").addEventListener("click",async()=>{
      const oldKeys=Object.keys(state.vars);state={...state,gastos,tasas,vars};migrarPlan();
      store.saveRegistro();new Set([...oldKeys,...Object.keys(vars)]).forEach(k=>store.saveMes(k));
      if(sm["Gastos variables"])await baseSet(file);
      closeSheet();render();toast("Datos cargados desde Excel")});
  }catch(e){console.error(e);toast("No se pudo leer el archivo. ¿Es un Excel .xlsx?")}
}
